## requires:
##     font : Hack (pango) : https://github.com/source-foundry/Hack
##            or Terminus (pango)
##     i3status
##     pactl (pulseaudio volume keys)
##     rofi
##     xbacklight
##     xscreensaver (for screen lock)
##     xterm
##     gv_light : ~/git/mine/gv_light/gv_light.sh (lamp keys)
##
## ln -s ~/git/mine/dotfiles/i3wm/i3-clarum.conf ~/.config/i3/config
## ln -s ~/git/mine/dotfiles/i3wm/i3status-clarum.conf ~/.config/i3/i3status.conf

#############################
## Configured Key Bindings ##
#############################
#
#### mod key mappings 
# WIN KEY   mod key (Mod4)
#
# #### apps
# d         rofi
# p         xscreensaver lockscreen
# RET       xterm
#
# #### window actions
# SHIFT q   kill focused window
# h         focus left
# j         focus down
# k         focus up
# l         focus right
# SHIFT h   move focused window left
# SHIFT j   move focused window down
# SHIFT k   move focused window up
# SHIFT l   move focused window right
# CTRL v    split horizontal
# CTRL h    split vertical
#
# #### i3wm window / container layout actions
# f         toggle fullscreen
# s         layout stacking
# w         layout tabbed
# e         layout toggle split
# SHIFT SPACE       layout toggle floating
#
# #### focus
# SPACE     change focus between tiling / float windows
# a         focus parent
#
# #### workspace movement
# 1..0      switch to workspace 1 - 10
# SHIFT 1..0        move focused container to workspace
#
# #### i3wm config reload / restart
# SHIFT c   reload configuration file
# SHIFT r   restart i3wm in place
# SHIFT e   exit i3wm (with confirmation)
#
# #### window resize
# r         toggle window resize
# ## window resize when toggled (arrow keys)
# # left    shrink width
# # down    grow height
# # up      shrink height
# # right   grow width
# ## escape resize mode (non mod)
# # RETURN
# # ESCAPE
# ## escape resize mode (mod)
# r
#
######################
## End Key Bindings ##
######################


set $mod Mod4

##set $font "pango:Terminus 16"
set $font "pango:Hack 14"
font $font

### lamps
## power toggle
bindsym $mod+Shift+F1 exec --no-startup-id \
    ~/git/mine/gv_light/gv_light.sh -p
## brightness decrease
bindsym $mod+Shift+F5 exec --no-startup-id \
    ~/git/mine/gv_light/gv_light.sh -b dec
## brightness increase
bindsym $mod+Shift+F6 exec --no-startup-id \
    ~/git/mine/gv_light/gv_light.sh -b inc
## brightness reset (100%)
bindsym $mod+Shift+F4 exec --no-startup-id \
    ~/git/mine/gv_light/gv_light.sh -b reset

# Use pactl to adjust volume in PulseAudio.
set $refresh_i3status killall -SIGUSR1 i3status
bindsym XF86AudioRaiseVolume exec --no-startup-id \
    pactl set-sink-volume @DEFAULT_SINK@ +2% && $refresh_i3status
bindsym XF86AudioLowerVolume exec --no-startup-id \
    pactl set-sink-volume @DEFAULT_SINK@ -2% && $refresh_i3status
bindsym XF86AudioMute exec --no-startup-id \
    pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
bindsym XF86AudioMicMute exec --no-startup-id \
    pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status

## use xbacklight for mon brightness
bindsym XF86MonBrightnessUp exec --no-startup-id \
    xbacklight +2
bindsym XF86MonBrightnessDown exec --no-startup-id \
    xbacklight -2

# start rofi (a program launcher)
bindsym $mod+d exec --no-startup-id \
    rofi \
        -show combi \
        -theme solarized_alternate

# lock screen (xscreensaver)
bindsym $mod+p exec --no-startup-id \
    xscreensaver-command -lock

# start a terminal
bindsym $mod+Return exec --no-startup-id \
    xterm

# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod

# kill focused window
bindsym $mod+Shift+q kill

#### window appearance
default_border pixel 1
default_floating_border pixel 1

# Configure 15px of space between windows and to the screen edges.
gaps inner 15px

# Uncomment to add extra space to the screen edges only
# (outer is added on top of inner, e.g. 15px + 5px = 20px at the edges).
# gaps outer 5px

# Enabling “Smart Gaps” means no gaps will be shown when there is
# precisely one window or split container on the workspace.
#
# inverse_outer only enables outer gaps when there is exactly one
# window or split container on the workspace.
#smart_gaps on|off|inverse_outer
smart_gaps on

# focus follows mouse
focus_follows_mouse yes
# bindsym $mod+n exec --no-startup-id \
#     "sed -i '/^focus_follows_mouse/{s/yes/no/;t;s/no/yes/}' \
#     ~/git/mine/dotfiles/i3wm/i3-clarum.conf; i3-msg reload"

# change focus
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# split vertical (new window opens below)
bindsym $mod+Ctrl+h split v

# split horizontal (new window opens to the right)
bindsym $mod+Ctrl+v split h

# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle

# change focus between tiling / floating windows
bindsym $mod+space focus mode_toggle

# focus the parent container
bindsym $mod+a focus parent

# Define names for default workspaces
set $ws1 "1: Term"
set $ws2 "2: Qute"
set $ws3 "3: Viv "
set $ws9 "9: Tor "

# switch to workspace
bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace 10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace $ws9
bindsym $mod+Shift+0 move container to workspace 10

# Assign Workspaces:
# find class : xprop | grep WM_CLASS | awk '{print $4}'
assign [class="XTerm"] $ws1
for_window [class="XTerm"] fullscreen enable
assign [class="qutebrowser"] $ws2
assign [class="Signal"] $ws2
assign [class="Vivaldi-stable"] $ws3
assign [class="firefox"] 4
assign [class="Tor Browser"] $ws9

# reload the configuration file
bindsym $mod+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym $mod+Shift+r restart
# exit i3 (logs you out of your X session)
bindsym $mod+Shift+e exec --no-startup-id \
    i3-nagbar -t warning -m 'Exit i3? This will end your X session.' \
        -B 'Yes, exit i3' 'i3-msg exit'

# resize window (you can also use the mouse for that)
bindsym $mod+r mode "resize"
mode "resize" {
        bindsym Left resize shrink width 2 px or 2 ppt
        bindsym Down resize grow height 2 px or 2 ppt
        bindsym Up resize shrink height 2 px or 2 ppt
        bindsym Right resize grow width 2 px or 2 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

# status bar
bar {
        ## disable mouse scrolling between workspaces on bar
        bindsym button4 nop
        bindsym button5 nop
        bindsym button6 nop
        bindsym button7 nop
        colors {
            background  #000000
            statusline  #839496
            separator   #268BD2
            ##                  border      background  text
            focused_workspace   #343434     #002B36     #D2D2D2
            inactive_workspace  #000000     #000000     #586E75
            urgent_workspace    #CB4B16     #DC322F     #DDDDDD
        }
        position top
        separator_symbol " · "
        status_command i3status -c ~/.config/i3/i3status.conf
        tray_output none
}
